      {id:'q13',subject:'Таърихи халқи тоҷик',text:'Рӯзи Ваҳдати миллӣ дар Тоҷикистон кадом сана таҷлил мешавад?',options:['27 июн','9 сентябр','6 ноябр','1 май'],correct:0},
      {id:'q14',subject:'Таърихи халқи тоҷик',text:'Кадом забон мақоми забони давлатии Ҷумҳурии Тоҷикистонро дорад?',options:['Забони тоҷикӣ','Забони русӣ','Забони англисӣ','Забони ӯзбекӣ'],correct:0},
      {id:'q15',subject:'Асосҳои ҳуқуқ',text:'Вазифаи асосии мақомоти ҳифзи ҳуқуқ кадом аст?',options:['Ҳифзи ҳуқуқу озодиҳои шаҳрвандон ва тартиботи ҷамъиятӣ','Танзими барномаҳои таълимӣ','Идоракунии муассисаҳои тиббӣ','Таъйини нархи молҳо'],correct:0}

  let data = loadData();

  function loadData(){
    try {
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
      if (saved && Array.isArray(saved.users) && Array.isArray(saved.exams)) {
        const merged = {...starter,...saved};
        merged.users = merged.users.filter(user=>user.role!=='teacher');
        if(merged.currentUser?.role==='teacher')merged.currentUser=null;
        merged.subjects = [...new Set([...(Array.isArray(saved.subjects)?saved.subjects:[]),...merged.questions.map(question=>question.subject)])];
        merged.groups = [...new Set([...(Array.isArray(saved.groups)?saved.groups:[]),...merged.users.map(user=>user.group),...merged.exams.map(exam=>exam.group)].filter(Boolean))];
        return merged;
      }
    } catch (_) {}
    localStorage.setItem(STORAGE_KEY, JSON.stringify(starter));
    return structuredClone(starter);
  }
  function persist(){localStorage.setItem(STORAGE_KEY,JSON.stringify(data));}
  function esc(value=''){return String(value).replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));}
  function id(prefix){return prefix+'-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,6);}
  function shuffle(items){const copy=[...items];for(let i=copy.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[copy[i],copy[j]]=[copy[j],copy[i]];}return copy;}
  function initials(name){return name.split(/\s+/).slice(0,2).map(part=>part[0]||'').join('');}
  function roleName(role){return role==='student'?'Донишҷӯ':'Администратор';}
  function subjects(){return [...new Set([...data.subjects,...data.questions.map(q=>q.subject)])].sort((a,b)=>a.localeCompare(b,'tg'));}
  function formatDate(value){const date=new Date(value);const months=['январ','феврал','март','апрел','май','июн','июл','август','сентябр','октябр','ноябр','декабр'];return `${date.getDate()} ${months[date.getMonth()]} ${date.getFullYear()}`;}
  function setToast(text){const node=document.createElement('div');node.className='toast';node.textContent=text;document.body.append(node);setTimeout(()=>node.remove(),2600);}

      <section class="login-main"><div class="login-card"><div class="mobile-brand"><img src="images.jfif" alt="Нишони Тоҷикистон"><strong>КОЛЛЕҶИ МИЛИТСИЯИ ВКД<span>ҶУМҲУРИИ ТОҶИКИСТОН</span></strong></div><div class="login-kicker">Портали имтиҳонӣ</div><h2>Воридшавӣ</h2><p class="login-sub">Барои идома маълумоти ҳисоби худро ворид кунед.</p>
      <form id="login-form"><div class="field"><label for="login">Логин</label><input id="login" name="login" autocomplete="username" placeholder="Рақами донишҷӯ ё логин" required></div><div class="field"><label for="password">Рамз</label><div class="password-control"><input id="password" name="password" type="password" autocomplete="current-password" placeholder="Рамзи воридшавӣ" required><button class="password-toggle" type="button" data-password-toggle aria-label="Намоиши рамз" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button></div></div><div id="login-error" class="login-error" aria-live="polite"></div><button class="btn btn-block" type="submit">Ворид шудан <span aria-hidden="true">→</span></button></form></div></section></main>`;
    document.getElementById('login-form').addEventListener('submit',login);
    bindPasswordToggles(root);

  function bindPasswordToggles(container){
    container.querySelectorAll('[data-password-toggle]').forEach(button=>button.addEventListener('click',()=>{
      const input=button.closest('.password-control')?.querySelector('input');
      if(!input)return;
      const visible=input.type==='password';
      input.type=visible?'text':'password';
      button.setAttribute('aria-pressed',String(visible));
      button.setAttribute('aria-label',visible?'Пинҳон кардани рамз':'Намоиши рамз');
      button.innerHTML=visible?'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 3 18 18M10.6 10.6a2 2 0 0 0 2.8 2.8"/><path d="M9.9 5.2A10.8 10.8 0 0 1 12 5c6.4 0 10 7 10 7a16 16 0 0 1-3.1 3.8M6.2 6.2C3.5 8.1 2 12 2 12s3.6 7 10 7a10.8 10.8 0 0 0 3-.4"/></svg>':'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>';
    }));
  }
  function login(event){
    event.preventDefault();const username=document.getElementById('login').value.trim();const password=document.getElementById('password').value;

    if(!user){document.getElementById('login-error').textContent='Логин ё рамз нодуруст аст.';return;}
    data.currentUser={id:user.id,username:user.username,name:user.name,role:user.role,group:user.group};persist();route='home';render();

  function navItems(){
    if(data.currentUser.role==='student')return [['home','⌂','Саҳифаи асосӣ'],['exams','▤','Имтиҳонҳо'],['results','▥','Натиҷаҳои ман']];
    return [['home','⌂','Шарҳи умумӣ'],['exams','▤','Имтиҳонҳо'],['questions','☷','Бонки саволҳо'],['results','▥','Натиҷаҳо'],...(data.currentUser.role==='admin'?[['users','♙','Истифодабарандагон']]:[])];
  }
  const routeTitles={home:'Саҳифаи асосӣ',exams:'Имтиҳонҳо',questions:'Бонки саволҳо',results:'Натиҷаҳо',users:'Истифодабарандагон'};
  function renderApp(){
    const user=data.currentUser;const nav=navItems();
    document.getElementById('root').innerHTML=`<div class="app-shell"><aside class="sidebar" id="sidebar"><div class="side-brand"><img src="images.jfif" alt=""><div><strong>КОЛЛЕҶИ МИЛИТСИЯИ ВКД</strong><small>ҶУМҲУРИИ ТОҶИКИСТОН</small></div></div><div class="role-label">Менюи асосӣ</div><nav class="nav-list">${nav.map(([key,icon,label])=>`<button class="nav-btn ${route===key?'active':''}" data-route="${key}">${navIcon(icon)}${label}</button>`).join('')}</nav><div class="side-spacer"></div><div class="user-mini"><div class="avatar">${esc(initials(user.name))}</div><div><strong>${esc(user.name)}</strong><span>${roleName(user.role)}${user.group?' · '+esc(user.group):''}</span></div><button class="logout" title="Баромадан" aria-label="Баромадан" data-action="logout">↪</button></div></aside><main class="main-area"><header class="topbar"><div class="top-left"><button class="mobile-menu" data-action="menu" aria-label="Кушодани меню">☰</button><span class="crumb">Портал</span><span class="top-title">/ ${routeTitles[route]||'Имтиҳон'}</span></div><div class="top-right"><span><i class="status-dot"></i>Низом фаъол аст</span><span>${formatDate(Date.now())}</span></div></header><section class="page" id="page-content">${renderPage()}</section></main></div>`;

  function heading(title,subtitle,actions=''){return `<div class="page-heading"><div><h1>${title}</h1><p>${subtitle}</p></div><div class="heading-actions">${actions}</div></div>`;}
  function metric(label,value,note){return `<div class="metric"><div class="metric-label">${label}</div><div class="metric-value">${value}</div><div class="metric-note">${note}</div></div>`;}
  function renderPage(){
    if(route==='home')return data.currentUser.role==='student'?studentHome():staffHome();
    if(route==='exams')return data.currentUser.role==='student'?studentExams():staffExams();
    if(route==='questions')return questionBank();
    if(route==='results')return resultsPage();
    if(route==='users')return usersPage();
    return '';

  function availableExams(){const user=data.currentUser;return data.exams.filter(exam=>exam.active&&(!exam.group||exam.group==='Ҳама гурӯҳҳо'||exam.group===user.group)).map(exam=>({...exam,completed:data.results.some(result=>result.userId===user.id&&(result.examId===exam.id||(!result.examId&&result.title===exam.title)))}));}
  function studentHome(){
    const user=data.currentUser;const exams=availableExams();const own=data.results.filter(item=>item.userId===user.id).sort((a,b)=>b.finishedAt-a.finishedAt);const avg=own.length?Math.round(own.reduce((sum,item)=>sum+item.percent,0)/own.length):0;
    return `<div class="welcome-strip"><div><h2>Хуш омадед, ${esc(user.name.split(' ')[0])}</h2><p>${esc(user.group||'')} · Рӯзи хуб барои санҷидани дониш</p></div><button class="btn" data-route="exams">Имтиҳонҳоро дидан →</button></div><div class="metric-grid">${metric('Имтиҳонҳои дастрас',exams.length,'барои гурӯҳи шумо')}${metric('Имтиҳонҳои супорида',own.length,'дар ин дастгоҳ сабт шудааст')}${metric('Баҳои миёна',own.length?avg+'%':'—',own.length?'аз натиҷаҳои шумо':'ҳоло натиҷа нест')}${metric('Ҳолати ҳисоб','Фаъол','воридшавӣ тасдиқ шуд')}</div><div class="content-grid"><section class="panel"><div class="panel-head"><h2>Имтиҳонҳои дастрас</h2><button class="btn btn-outline" data-route="exams">Ҳамааш →</button></div><div class="panel-body">${examCards(exams.slice(0,3))}</div></section><section class="panel"><div class="panel-head"><h2>Натиҷаҳои охирин</h2><button class="btn btn-outline" data-route="results">Таърих →</button></div>${own.length?`<div class="table-wrap"><table><thead><tr><th>Фан</th><th>Хол</th><th>Баҳо</th></tr></thead><tbody>${own.slice(0,4).map(result=>`<tr><td class="table-primary">${esc(result.title)}</td><td>${result.correct}/${result.total}</td><td><span class="tag ${result.percent<60?'tag-red':''}">${result.grade}</span></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty-state">Натиҷаҳои шумо пас аз супоридани имтиҳон дар ин ҷо пайдо мешаванд.</div>'}</section></div>`;
  }
  function examCards(exams){if(!exams.length)return '<div class="empty-state">Ҳоло имтиҳони дастрас нест.</div>';return `<div class="exam-list">${exams.map(exam=>`<article class="exam-card"><div><h3>${esc(exam.title)}</h3><div class="exam-meta"><span>${esc(exam.subject)}</span><span>${exam.minutes} дақиқа</span><span>${Math.min(exam.count,data.questions.filter(q=>q.subject===exam.subject).length)} савол</span>${exam.group?`<span>Гурӯҳи ${esc(exam.group)}</span>`:''}</div></div>${exam.completed?'<span class="tag">Аллакай супорида шуд</span>':`<button class="btn" data-start="${exam.id}">Оғози имтиҳон</button>`}</article>`).join('')}</div>`;}
  function studentExams(){const exams=availableExams();return `${heading('Имтиҳонҳо','Фанни дилхоҳро интихоб кунед. Пас аз оғоз вақт ҳисоб мешавад.')}<div class="notice">Пеш аз оғоз, пайвасти компютерро санҷед. Ҳангоми ба охир расидани вақт ҷавобҳои интихобшуда ба таври автоматӣ пешниҳод мешаванд.</div><div style="height:16px"></div>${examCards(exams)}`;}
  function staffHome(){
    const allResults=[...data.results].sort((a,b)=>b.finishedAt-a.finishedAt);const avg=data.results.length?Math.round(data.results.reduce((sum,r)=>sum+r.percent,0)/data.results.length):0;const students=data.users.filter(u=>u.role==='student').length;
    return `${heading('Шарҳи умумӣ','Вазъи имтиҳонҳо ва натиҷаҳои донишҷӯён.',`<button class="btn" data-modal="exam">+ Имтиҳони нав</button>`)}<div class="metric-grid">${metric('Имтиҳонҳои фаъол',data.exams.filter(e=>e.active).length,'аз '+data.exams.length+' имтиҳон')}${metric('Бонки саволҳо',data.questions.length,'аз '+subjects().length+' фан')}${metric('Донишҷӯён',students,'ҳисобҳои сабтшуда')}${metric('Баҳои миёна',data.results.length?avg+'%':'—',data.results.length+' натиҷаи сабтшуда')}</div><div class="content-grid"><section class="panel"><div class="panel-head"><h2>Натиҷаҳои охирин</h2><button class="btn btn-outline" data-route="results">Ҳама натиҷаҳо →</button></div>${resultTable(allResults.slice(0,6))}</section><section class="panel"><div class="panel-head"><h2>Имтиҳонҳо</h2><button class="btn btn-outline" data-route="exams">Идоракунӣ →</button></div><div class="panel-body">${data.exams.slice(0,5).map(e=>`<div style="display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid #edf0ed;font-size:11px"><span class="table-primary">${esc(e.title)}</span><span class="tag ${e.active?'':'tag-red'}">${e.active?'Фаъол':'Ғайрифаъол'}</span></div>`).join('')||'<div class="empty-state">Имтиҳон ҳанӯз сохта нашудааст.</div>'}</div></section></div>`;
  }
  function resultTable(results){if(!results.length)return '<div class="empty-state">Натиҷа ҳанӯз сабт нашудааст.</div>';return `<div class="table-wrap"><table><thead><tr><th>Донишҷӯ</th><th>Гурӯҳ</th><th>Фан</th><th>Дуруст</th><th>Хол</th><th>Баҳо</th><th>Сана</th></tr></thead><tbody>${results.map(r=>`<tr><td class="table-primary">${esc(r.studentName)}</td><td>${esc(r.group||'—')}</td><td>${esc(r.title)}</td><td>${r.correct}/${r.total}</td><td>${r.percent}%</td><td><span class="tag ${r.percent<60?'tag-red':''}">${r.grade}</span></td><td>${formatDate(r.finishedAt)}</td></tr>`).join('')}</tbody></table></div>`;}
  function staffExams(){return `${heading('Имтиҳонҳо','Имтиҳонҳоро эҷод, фаъол ё ғайрифаъол кунед.',`<button class="btn" data-modal="exam">+ Имтиҳони нав</button>`)}<section class="panel"><div class="table-wrap"><table><thead><tr><th>Номи имтиҳон</th><th>Фан</th><th>Вақт</th><th>Савол</th><th>Гурӯҳ</th><th>Ҳолат</th><th>Амалиёт</th></tr></thead><tbody>${data.exams.length?data.exams.map(e=>`<tr><td class="table-primary">${esc(e.title)}</td><td>${esc(e.subject)}</td><td>${e.minutes} дақ.</td><td>${e.count}</td><td>${esc(e.group||'Ҳама')}</td><td><span class="tag ${e.active?'':'tag-red'}">${e.active?'Фаъол':'Ғайрифаъол'}</span></td><td><button class="btn btn-outline" data-toggle-exam="${e.id}">${e.active?'Қатъ':'Фаъол'}</button> <button class="btn btn-outline" data-delete-exam="${e.id}" aria-label="Нест кардан">×</button></td></tr>`).join(''):'<tr><td colspan="7" class="empty-state">Имтиҳон илова кунед.</td></tr>'}</tbody></table></div></section>`;}
  function questionBank(){const subjectAction=data.currentUser.role==='admin'?'<button class="btn btn-outline" data-modal="subject">+ Фанни нав</button>':'';return `${heading('Бонки саволҳо','Саволҳои тестӣ аз рӯи фанҳо.',`${subjectAction}<button class="btn" data-modal="question">+ Саволи нав</button>`)}<div class="subject-strip"><strong>Фанҳо</strong>${subjects().map(subject=>`<span class="tag tag-gold">${esc(subject)} <small>${data.questions.filter(question=>question.subject===subject).length} савол</small>${data.currentUser.role==='admin'?`<button class="btn btn-outline" data-delete-subject="${esc(subject)}" title="Нест кардани фан" aria-label="Нест кардани фан ${esc(subject)}">×</button>`:''}</span>`).join('')}</div><div class="filter-row"><select id="subject-filter"><option value="">Ҳамаи фанҳо</option>${subjects().map(s=>`<option>${esc(s)}</option>`).join('')}</select><input id="question-search" placeholder="Ҷустуҷӯи савол..." aria-label="Ҷустуҷӯи савол"><span class="muted" id="question-count">${data.questions.length} савол</span></div><section class="panel"><div class="table-wrap"><table><thead><tr><th>Фан</th><th>Савол</th><th>Ҷавоби дуруст</th><th></th></tr></thead><tbody id="question-rows">${questionRows(data.questions)}</tbody></table></div></section>`;}
  function questionRows(items){return items.length?items.map(q=>`<tr data-subject="${esc(q.subject)}" data-search="${esc((q.text+' '+q.subject).toLowerCase())}"><td><span class="tag tag-gold">${esc(q.subject)}</span></td><td class="table-primary">${esc(q.text)}</td><td>${letters[q.correct]}. ${esc(q.options[q.correct])}</td><td><button class="btn btn-outline" data-delete-question="${q.id}" aria-label="Нест кардани савол">×</button></td></tr>`).join(''):'<tr><td colspan="4" class="empty-state">Савол ёфт нашуд.</td></tr>';}
  function resultsPage(){const isStudent=data.currentUser.role==='student';const items=(isStudent?data.results.filter(r=>r.userId===data.currentUser.id):data.results).sort((a,b)=>b.finishedAt-a.finishedAt);return `${heading(isStudent?'Натиҷаҳои ман':'Натиҷаҳои имтиҳон','Натиҷаҳои сабтшуда ва ведомости имтиҳонӣ.',isStudent?'':`<button class="btn btn-outline" data-action="print">Чопи ведомост</button>`)}<div class="metric-grid">${metric('Имтиҳонҳои супорида',items.length,'натиҷаи сабтшуда')}${metric('Дуруст ҷавобшуда',items.reduce((s,r)=>s+r.correct,0),'ҷавоби дуруст')}${metric('Холи миёна',items.length?Math.round(items.reduce((s,r)=>s+r.percent,0)/items.length)+'%':'—','аз рӯи натиҷаҳо')}${metric('Баҳои аъло',items.filter(r=>r.grade==='Аъло').length,'натиҷаи 90% ва болотар')}</div><section class="panel"><div class="panel-head"><h2>${isStudent?'Таърихи имтиҳонҳо':'Ведомости имтиҳонӣ'}</h2><span class="muted">${items.length} сабт</span></div>${resultTable(items)}</section>`;}
  function usersPage(){const actions=`<button class="btn btn-outline" data-modal="group">+ Гурӯҳи нав</button><button class="btn" data-modal="user">+ Донишҷӯ / ҳисоб</button>`;return `${heading('Истифодабарандагон','Донишҷӯёнро ба гурӯҳҳои таълимӣ илова кунед.',actions)}<section class="panel" style="margin-bottom:16px"><div class="panel-head"><h2>Гурӯҳҳои таълимӣ</h2><span class="muted">${data.groups.length} гурӯҳ</span></div><div class="table-wrap"><table><thead><tr><th>Номи гурӯҳ</th><th>Донишҷӯён</th><th>Имтиҳонҳои фаъол</th><th></th></tr></thead><tbody>${data.groups.length?data.groups.map(group=>`<tr><td class="table-primary">${esc(group)}</td><td>${data.users.filter(user=>user.role==='student'&&user.group===group).length}</td><td>${data.exams.filter(exam=>exam.active&&(!exam.group||exam.group===group||exam.group==='Ҳама гурӯҳҳо')).length}</td><td><button class="btn btn-outline" data-delete-group="${esc(group)}" title="Нест кардани гурӯҳ" aria-label="Нест кардани гурӯҳ ${esc(group)}">×</button></td></tr>`).join(''):'<tr><td colspan="4" class="empty-state">Аввал гурӯҳи таълимӣ илова кунед.</td></tr>'}</tbody></table></div></section><section class="panel"><div class="panel-head"><h2>Ҳисобҳои корбарон</h2><span class="muted">${data.users.length} ҳисоб</span></div><div class="table-wrap"><table><thead><tr><th>Ном</th><th>Логин</th><th>Нақш</th><th>Гурӯҳ</th><th>Имтиҳонҳо</th><th></th></tr></thead><tbody>${data.users.map(user=>`<tr><td class="table-primary">${esc(user.name)}</td><td>${esc(user.username)}</td><td><span class="tag">${roleName(user.role)}</span></td><td>${esc(user.group||'—')}</td><td>${data.results.filter(r=>r.userId===user.id).length}</td><td>${user.role==='student'?`<button class="btn btn-outline" data-delete-student="${esc(user.id)}" title="Хориҷ кардани донишҷӯ" aria-label="Хориҷ кардани ${esc(user.name)}">×</button>`:'—'}</td></tr>`).join('')}</tbody></table></div></section><div class="notice">Маълумот дар ин намуна танҳо дар браузери ҷорӣ нигоҳ дошта мешавад. Барои истифодаи чанд компютер сервер ва пойгоҳи додаҳои муштарак заруранд.</div>`;}
  function bindAppEvents(){
    document.querySelectorAll('[data-route]').forEach(button=>button.addEventListener('click',()=>{route=button.dataset.route;document.getElementById('sidebar')?.classList.remove('open');renderApp();}));
    document.querySelector('[data-action="logout"]')?.addEventListener('click',logout);
    document.querySelector('[data-action="menu"]')?.addEventListener('click',()=>document.getElementById('sidebar').classList.toggle('open'));
    document.querySelector('[data-action="print"]')?.addEventListener('click',()=>window.print());
    document.querySelectorAll('[data-start]').forEach(button=>button.addEventListener('click',()=>startExam(button.dataset.start)));
    document.querySelectorAll('[data-modal]').forEach(button=>button.addEventListener('click',()=>openModal(button.dataset.modal)));
    document.querySelectorAll('[data-toggle-exam]').forEach(button=>button.addEventListener('click',()=>{const exam=data.exams.find(e=>e.id===button.dataset.toggleExam);exam.active=!exam.active;persist();renderApp();setToast('Ҳолати имтиҳон нав карда шуд.');}));
    document.querySelectorAll('[data-delete-exam]').forEach(button=>button.addEventListener('click',()=>{if(confirm('Ин имтиҳон нест карда шавад?')){data.exams=data.exams.filter(e=>e.id!==button.dataset.deleteExam);persist();renderApp();}}));
    document.querySelectorAll('[data-delete-question]').forEach(button=>button.addEventListener('click',()=>{if(confirm('Ин савол нест карда шавад?')){data.questions=data.questions.filter(q=>q.id!==button.dataset.deleteQuestion);persist();renderApp();}}));
    document.querySelectorAll('[data-delete-student]').forEach(button=>button.addEventListener('click',()=>{if(!confirm('Ҳисоби донишҷӯ хориҷ шавад? Натиҷаҳои пешина нигоҳ дошта мешаванд.'))return;const student=data.users.find(user=>user.id===button.dataset.deleteStudent);if(data.attempt&&data.attempt.userId===student?.id){setToast('Донишҷӯ имтиҳони фаъол дорад.');return;}data.users=data.users.filter(user=>user.id!==button.dataset.deleteStudent);if(data.currentUser?.id===button.dataset.deleteStudent){data.currentUser=null;data.attempt=null;}persist();renderApp();setToast('Ҳисоби донишҷӯ хориҷ шуд.');}));
    document.querySelectorAll('[data-delete-group]').forEach(button=>button.addEventListener('click',()=>{const group=button.dataset.deleteGroup;if(!confirm(`Гурӯҳи «${group}» нест карда шавад?`))return;if(data.users.some(user=>user.group===group)||data.exams.some(exam=>exam.group===group)){setToast('Гурӯҳ ба донишҷӯ ё имтиҳон пайваст аст.');return;}data.groups=data.groups.filter(item=>item!==group);persist();renderApp();}));
    document.querySelectorAll('[data-delete-subject]').forEach(button=>button.addEventListener('click',()=>{const subject=button.dataset.deleteSubject;if(!confirm(`Фани «${subject}» нест карда шавад?`))return;if(data.questions.some(question=>question.subject===subject)||data.exams.some(exam=>exam.subject===subject)){setToast('Фан ба савол ё имтиҳон пайваст аст.');return;}data.subjects=data.subjects.filter(item=>item!==subject);persist();renderApp();}));
    const filter=document.getElementById('subject-filter'),search=document.getElementById('question-search');
    if(filter&&search){const apply=()=>{const rows=[...document.querySelectorAll('#question-rows tr[data-subject]')];let count=0;rows.forEach(row=>{const show=(!filter.value||row.dataset.subject===filter.value)&&(!search.value||row.dataset.search.includes(search.value.toLowerCase()));row.classList.toggle('hidden',!show);if(show)count++;});document.getElementById('question-count').textContent=count+' савол';};filter.addEventListener('change',apply);search.addEventListener('input',apply);}
  }
  function logout(){if(clock)clearInterval(clock);data.currentUser=null;data.attempt=null;persist();render();}
  function openModal(type){
    const root=document.getElementById('modal-root');let title='',fields='',submit='';
    if(type==='group'){
      title='Иловаи гурӯҳи таълимӣ';fields='<div class="field"><label>Номи гурӯҳ</label><input name="group" required maxlength="60" placeholder="Масалан: 2-102"></div>';submit='Илова кардани гурӯҳ';
    }else if(type==='subject'){
      title='Иловаи фан';fields='<div class="field"><label>Номи фан</label><input name="subject" required maxlength="100" placeholder="Масалан: Забони тоҷикӣ"></div>';submit='Илова кардани фан';
    }else if(type==='exam'){
      title='Эҷоди имтиҳон';fields=`<div class="field"><label>Номи имтиҳон</label><input name="title" required placeholder="Масалан: Имтиҳони нимсолаи ҳуқуқ"></div><div class="field-row"><div class="field"><label>Фан</label><select name="subject" required>${subjects().map(s=>`<option>${esc(s)}</option>`).join('')}</select></div><div class="field"><label>Гурӯҳ</label><input name="group" placeholder="2-101 ё холӣ барои ҳама"></div></div><div class="field-row"><div class="field"><label>Вақт (дақиқа)</label><input name="minutes" type="number" min="1" max="240" value="60" required></div><div class="field"><label>Шумораи савол</label><input name="count" type="number" min="1" max="100" value="10" required></div></div>`;submit='Сохтани имтиҳон';
    }else if(type==='question'){
      const opts=Array.from({length:4},(_,i)=>`<div class="field"><label>Ҷавоби ${letters[i]}</label><input name="option${i}" required></div>`).join('');
      title='Иловаи саволи тестӣ';fields=`<div class="field"><label>Фан</label><select name="subject" required>${subjects().map(subject=>`<option value="${esc(subject)}">${esc(subject)}</option>`).join('')}</select></div><div class="field"><label>Матни савол</label><textarea name="text" required placeholder="Саволро нависед..."></textarea></div>${opts}<div class="field"><label>Ҷавоби дуруст</label><select name="correct">${letters.map((l,i)=>`<option value="${i}">${l}</option>`).join('')}</select></div>`;submit='Сабти савол';
    }else{
      title='Иловаи донишҷӯ';fields=`<div class="field"><label>Номи пурра</label><input name="name" required></div><div class="field-row"><div class="field"><label>Логин</label><input name="username" required></div><div class="field"><label>Рамзи ибтидоӣ</label><input name="password" required value="1234"></div></div><div class="field"><label>Гурӯҳ</label><select name="group" required><option value="">Гурӯҳро интихоб кунед</option>${data.groups.map(group=>`<option value="${esc(group)}">${esc(group)}</option>`).join('')}</select></div>`;submit='Иловаи донишҷӯ';
    }
    root.innerHTML=`<div class="modal-backdrop" data-dismiss><section class="modal" role="dialog" aria-modal="true" aria-label="${title}"><div class="modal-head"><h2>${title}</h2><button class="modal-close" data-close aria-label="Пӯшидан">×</button></div><form id="modal-form"><div class="modal-content">${fields}<div class="login-error" id="modal-error"></div></div><div class="modal-foot"><button type="button" class="btn btn-outline" data-close>Бекор кардан</button><button class="btn" type="submit">${submit}</button></div></form></section></div>`;
    root.querySelectorAll('[data-close]').forEach(button=>button.addEventListener('click',closeModal));root.querySelector('[data-dismiss]').addEventListener('click',event=>{if(event.target===event.currentTarget)closeModal();});root.querySelector('#modal-form').addEventListener('submit',event=>saveModal(event,type));root.querySelector('input')?.focus();
  }
  function closeModal(){document.getElementById('modal-root').innerHTML='';}
  function saveModal(event,type){
    event.preventDefault();const form=new FormData(event.currentTarget);const val=key=>String(form.get(key)||'').trim();
    if(type==='group'){
      const group=val('group');
      if(data.groups.some(existing=>existing.toLocaleLowerCase('tg')===group.toLocaleLowerCase('tg'))){document.getElementById('modal-error').textContent='Ин гурӯҳ аллакай илова шудааст.';return;}
      data.groups.push(group);
    }else if(type==='subject'){
      const subject=val('subject');
      if(subjects().some(existing=>existing.toLocaleLowerCase('tg')===subject.toLocaleLowerCase('tg'))){document.getElementById('modal-error').textContent='Ин фан аллакай илова шудааст.';return;}
      data.subjects.push(subject);
    }else if(type==='exam'){
      const subject=val('subject');if(!data.questions.some(q=>q.subject===subject)){document.getElementById('modal-error').textContent='Барои ин фан аввал савол илова кунед.';return;}
      data.exams.unshift({id:id('e'),title:val('title'),subject,minutes:Math.max(1,Number(val('minutes'))||60),count:Math.max(1,Number(val('count'))||10),group:val('group'),active:true});
    }else if(type==='question'){
      const subject=val('subject');if(!data.subjects.includes(subject))data.subjects.push(subject);
      data.questions.unshift({id:id('q'),subject,text:val('text'),options:[0,1,2,3].map(i=>val('option'+i)),correct:Number(val('correct'))});
    }else{
      if(data.users.some(user=>user.username.toLowerCase()===val('username').toLowerCase())){document.getElementById('modal-error').textContent='Ин логин аллакай истифода мешавад.';return;}
      if(!data.groups.includes(val('group'))){document.getElementById('modal-error').textContent='Барои донишҷӯ гурӯҳро интихоб кунед.';return;}
      data.users.push({id:id('u'),username:val('username'),password:val('password'),name:val('name'),role:'student',group:val('group')});
    }
    persist();closeModal();renderApp();setToast(type==='group'?'Гурӯҳ илова шуд.':type==='subject'?'Фан илова шуд.':type==='exam'?'Имтиҳон сохта шуд.':type==='question'?'Савол ба бонк илова шуд.':'Донишҷӯ илова шуд.');
  }
  function startExam(examId){
    const exam=data.exams.find(e=>e.id===examId);if(!exam)return;
    if(data.results.some(result=>result.userId===data.currentUser.id&&(result.examId===exam.id||(!result.examId&&result.title===exam.title)))){setToast('Ин имтиҳонро аллакай супоридаед. Такроран супорида намешавад.');return;}
    let pool=data.questions.filter(q=>q.subject===exam.subject);if(!pool.length){setToast('Барои ин фан савол мавҷуд нест.');return;}
    const selected=shuffle(pool).slice(0,Math.min(exam.count,pool.length));
    data.attempt={id:id('attempt'),examId:exam.id,title:exam.title,subject:exam.subject,questionIds:selected.map(q=>q.id),order:selected.map(q=>q.id),answers:{},startedAt:Date.now(),endsAt:Date.now()+exam.minutes*60*1000,minutes:exam.minutes};questionIndex=0;persist();render();
  }
  function remainingSeconds(){return Math.max(0,Math.ceil((data.attempt.endsAt-Date.now())/1000));}
  function renderExam(){
    if(clock)clearInterval(clock);const attempt=data.attempt;const questions=attempt.order.map(qid=>data.questions.find(q=>q.id===qid)).filter(Boolean);if(!questions.length){data.attempt=null;persist();render();return;}
    questionIndex=Math.min(questionIndex,questions.length-1);const question=questions[questionIndex];const answer=attempt.answers[question.id];const remaining=remainingSeconds();
    document.getElementById('root').innerHTML=`<main class="page exam-screen"><div class="exam-top"><div><h1>${esc(attempt.title)}</h1><small>${esc(attempt.subject)} · ${esc(data.currentUser.name)} · ${esc(data.currentUser.group||'')}</small></div><div class="timer ${remaining<300?'warn':''}" id="timer">${formatTime(remaining)}</div></div><div class="exam-progress"><div style="width:${Object.keys(attempt.answers).length/questions.length*100}%"></div></div><section class="exam-body"><div class="question-count">Саволи ${questionIndex+1} аз ${questions.length}</div><h2 class="question-text">${esc(question.text)}</h2><div class="option-list">${question.options.map((option,index)=>`<button class="option ${answer===index?'selected':''}" data-answer="${index}"><span class="option-letter">${letters[index]}</span><span>${esc(option)}</span></button>`).join('')}</div><div class="question-nav">${questions.map((q,i)=>`<button class="qdot ${i===questionIndex?'current':''} ${attempt.answers[q.id]!==undefined?'answered':''}" data-question-index="${i}" aria-label="Саволи ${i+1}">${i+1}</button>`).join('')}</div><div class="exam-footer"><button class="btn btn-outline" data-question-prev ${questionIndex===0?'disabled':''}>← Пешина</button><span class="muted" style="font-size:10px">${Object.keys(attempt.answers).length} аз ${questions.length} ҷавоб дода шуд</span><div>${questionIndex<questions.length-1?'<button class="btn" data-question-next>Саволи навбатӣ →</button>':'<button class="btn" data-submit>Анҷом додан</button>'}</div></div></section><div class="notice">Ҷавобҳо дар ин браузер нигоҳ дошта мешаванд. Барои супоридани имтиҳон тугмаи «Анҷом додан»-ро пахш кунед.</div></main>`;
    document.querySelectorAll('[data-answer]').forEach(button=>button.addEventListener('click',()=>{attempt.answers[question.id]=Number(button.dataset.answer);persist();renderExam();}));
    document.querySelectorAll('[data-question-index]').forEach(button=>button.addEventListener('click',()=>{questionIndex=Number(button.dataset.questionIndex);renderExam();}));
    document.querySelector('[data-question-prev]')?.addEventListener('click',()=>{questionIndex--;renderExam();});document.querySelector('[data-question-next]')?.addEventListener('click',()=>{questionIndex++;renderExam();});document.querySelector('[data-submit]')?.addEventListener('click',()=>submitExam(false));
    clock=setInterval(()=>{const seconds=remainingSeconds();const timer=document.getElementById('timer');if(timer){timer.textContent=formatTime(seconds);timer.classList.toggle('warn',seconds<300);}if(seconds<=0)submitExam(true);},1000);
  }
  function formatTime(seconds){return `${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`;}
  function submitExam(expired){
    if(!data.attempt)return;const attempt=data.attempt;const questions=attempt.order.map(qid=>data.questions.find(q=>q.id===qid)).filter(Boolean);const correct=questions.filter(q=>attempt.answers[q.id]===q.correct).length;const percent=questions.length?Math.round(correct/questions.length*100):0;const grade=percent>=90?'Аъло':percent>=75?'Хуб':percent>=60?'Қаноатбахш':'Ғайриқаноатбахш';
    if(!expired&&!confirm(`Имтиҳонро анҷом медиҳед? Ҷавоб додаед: ${Object.keys(attempt.answers).length} аз ${questions.length}.`))return;
    if(clock)clearInterval(clock);const result={id:id('r'),userId:data.currentUser.id,examId:attempt.examId,studentName:data.currentUser.name,group:data.currentUser.group,title:attempt.title,subject:attempt.subject,correct,total:questions.length,wrong:questions.length-correct,percent,grade,finishedAt:Date.now(),expired};data.results.push(result);data.attempt=null;persist();renderResult(result); 
  }
  function renderResult(result){
    document.getElementById('root').innerHTML=`<main class="page exam-screen"><div class="exam-top"><div><h1>Имтиҳон анҷом ёфт</h1><small>${esc(result.title)} · ${esc(result.studentName)}</small></div><span class="tag">Натиҷа сабт шуд</span></div><section class="result-hero"><div class="question-count" style="color:#d9c690">НАТИҶАИ ШУМО</div><div class="result-score">${result.percent}%</div><p>${result.correct} ҷавоби дуруст аз ${result.total} савол${result.expired?' · вақт ба охир расид':''}</p><div class="grade-mark">${result.grade}</div></section><div class="result-stats"><div class="result-stat"><b>${result.correct}</b><span>Ҷавоби дуруст</span></div><div class="result-stat"><b>${result.wrong}</b><span>Ҷавоби нодуруст</span></div><div class="result-stat"><b>${result.total}</b><span>Ҳамагӣ савол</span></div></div><div class="exam-body" style="border-top:0;text-align:center"><p class="muted">Натиҷа дар таърихи имтиҳонҳои шумо сабт шуд.</p><button class="btn" data-result-home>Бозгашт ба саҳифаи асосӣ</button> <button class="btn btn-outline" data-result-history>Натиҷаҳои ман</button></div></main>`;
    document.querySelector('[data-result-home]').addEventListener('click',()=>{route='home';renderApp();});document.querySelector('[data-result-history]').addEventListener('click',()=>{route='results';renderApp();});
  }
  render();
})();
</script>
</body>
</html>
